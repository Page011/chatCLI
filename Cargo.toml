[workspace]
resolver = "2"
members = ["crates/core", "crates/teams", "crates/whatsapp", "crates/tui", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/Page011/chatCLI"
license = "Apache-2.0"

[workspace.dependencies]
chatcli-core = { path = "crates/core" }
chatcli-teams = { path = "crates/teams" }
chatcli-whatsapp = { path = "crates/whatsapp" }
chatcli-tui = { path = "crates/tui" }

base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
# PNG/JPEG/GIF/WebP decode and re-encode (core: outgoing pictures drop EXIF; tui: thumbnails and
# the clipboard picture). Teams and WhatsApp use it only in tests, to build real picture files.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
keyring = { version = "3", features = ["windows-native"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "json"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
whatsapp-rust = { version = "0.7", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "tokio-native", "ureq-client", "signal"] }

[profile.release]
lto = "thin"
strip = true

# Ratatui from git until the next release (still 0.30.2 / core 0.1.2 on crates.io). This rev is
# the merge of ratatui#2686, which with ratatui#2721 before it stops an emoji ending in VS16
# (U+FE0F, e.g. ♻️ ❤️) from shifting the rest of its row one column right and leaving stale
# characters behind (ratatui#2651). Every ratatui crate comes from the same rev so they match.
# Drop this block once a release includes both PRs.
[patch.crates-io]
ratatui = { git = "https://github.com/ratatui/ratatui", rev = "67019321ab6aa49896708e203d6723dc592c0cdd" }
ratatui-core = { git = "https://github.com/ratatui/ratatui", rev = "67019321ab6aa49896708e203d6723dc592c0cdd" }
ratatui-crossterm = { git = "https://github.com/ratatui/ratatui", rev = "67019321ab6aa49896708e203d6723dc592c0cdd" }
ratatui-macros = { git = "https://github.com/ratatui/ratatui", rev = "67019321ab6aa49896708e203d6723dc592c0cdd" }
ratatui-termina = { git = "https://github.com/ratatui/ratatui", rev = "67019321ab6aa49896708e203d6723dc592c0cdd" }
ratatui-termwiz = { git = "https://github.com/ratatui/ratatui", rev = "67019321ab6aa49896708e203d6723dc592c0cdd" }
ratatui-widgets = { git = "https://github.com/ratatui/ratatui", rev = "67019321ab6aa49896708e203d6723dc592c0cdd" }
