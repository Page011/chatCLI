[package]
name = "chatcli"
description = "Terminal chat client for WhatsApp and Microsoft Teams"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chatcli"
path = "src/main.rs"

[dependencies]
chatcli-core.workspace = true
chatcli-teams.workspace = true
chatcli-tui.workspace = true
chatcli-whatsapp.workspace = true
tokio.workspace = true
chrono.workspace = true

# Windows toast notifications (issue 24): the same windows crate version ratatui-image already
# links, so the lockfile gains an edge, not a crate. Only the three areas the toast needs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Registry"] }

# Linux notifications over the session D-Bus (org.freedesktop.Notifications). The same dbus crate
# keyring's Secret Service backend already links (libdbus vendored there), so no new crate.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"
