name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not post tokens, secrets, real names, chat ids, message text or screenshots of your chats.
        Security problems: do not open an issue. Use the private report link in the issue chooser.
  - type: input
    id: version
    attributes:
      label: chatcli version
      description: Output of `chatcli --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and terminal
      description: For example Windows 11 23H2 in Windows Terminal, Ubuntu 24.04 in GNOME Terminal, or macOS 15 in iTerm2. On Linux, say which keyring you use (GNOME Keyring, KWallet, or CHATCLI_SECRET_STORE=file).
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Which network
      options:
        - Teams
        - WhatsApp
        - Both
        - Neither (start-up, TUI or relay)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: |
        WARNING: read every line before pasting. Remove names, ids, URLs of your own Worker and anything else that identifies you or other people.
        The log is `chatcli.log` in the data folder (Windows: `%LOCALAPPDATA%\chatcli`, Linux: `~/.local/share/chatcli`, macOS: `~/Library/Application Support/chatcli`); `chatcli --help` prints its path. Paste only the few lines around the problem. Never paste message text.
      render: text
    validations:
      required: false
