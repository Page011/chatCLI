name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not post tokens, secrets, real names or message text.
        Scope today: Windows (Linux and macOS experimental), text only, Teams 1:1 and group chats, WhatsApp direct and group chats.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want solved?
      description: Describe what you are trying to do, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: network
    attributes:
      label: Which network
      options:
        - Teams
        - WhatsApp
        - Both
        - Neither (TUI, relay or tooling)
    validations:
      required: true
