name = "chatcli-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Secrets RELAY_TOKEN and CLIENT_STATE are set with `wrangler secret put`, never here.

[[durable_objects.bindings]]
name = "HUB"
class_name = "RelayHub"

# new_sqlite_classes works on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayHub"]
